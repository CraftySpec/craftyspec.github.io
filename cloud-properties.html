<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chris Medcraft — Cloud properties</title>

  <link rel="stylesheet" href="site.css">
  <script src="site.js" defer></script>
</head>

<body>
  <div id="site-header"></div>

  <div class="layout">
    <div id="site-nav"></div>

    <main class="container">
      <h2>Cloud property retrieval  from hyperspectral images </h2>
      <p>These figures and images show the retrieval of various cloud properties from measured hyperspectral images using radiative transfer modelling</p>

      <figure class="figure-block">
        <img src="/figures/cth.png" alt="Retrieved cloud top height map" />
        <figcaption>
          Cloud top height retrieved from measured O₂ A-band absorption near 760&nbsp;nm. Radiative transfer modelled absorption depth at various cloud top altitudes, displayed CTH obtained from linear interpolation of model.
        </figcaption>
      </figure>

      <figure class="figure-block">
        <img src="/figures/LUT.png" alt="Calculated Reflectance Values for range of τ and re values" />
        <figcaption>Calculated Radiance against cloud microphysical properties</figcaption>
      </figure>

      <figure class="figure-block">
        <img src="/figures/tau.png" alt="Retrieved optical thickness" />
        <figcaption>Retrieved values for cloud optical thickness (τ)</figcaption>
      </figure>

      <figure class="figure-block">
        <img src="/figures/re.png" alt="Retrieved cloud droplet effective radius" />
        <figcaption>
          Retrieved values for cloud droplet effective radius (r<sub>e</sub>). An image artifact is visible
          on the left edge of the cloud.
        </figcaption>
      </figure>
    </main>
  </div>
  <footer id="mobile-nav"></footer>
</body>
</html>
